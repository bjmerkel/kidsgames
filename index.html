<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d7ecf3" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Kids Games</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <section id="menu">
      <p class="emery">Emery is awesome</p>
      <h1>Kids Games</h1>
      <button type="button" id="play-crab" class="game-card">
        Hermit Crab Crossing
        <small>Hop the yard. 5 levels.</small>
      </button>
      <button type="button" id="play-race" class="game-card">
        Woodland Grand Prix
        <small>10 racers, including a wood duck. 5 tracks.</small>
      </button>
      <button type="button" id="play-fish" class="game-card">
        Pond Fishing
        <small>Catch the fish each level asks for. 5 levels.</small>
      </button>
      <button type="button" id="play-axo" class="game-card">
        Axolotl Patrol
        <small>Pop the diving bugs. 5 levels.</small>
      </button>
      <button type="button" id="play-rascal" class="game-card">
        Web Rascal
        <small>Run, jump, and swing. 5 levels.</small>
      </button>
      <button type="button" id="play-capy" class="game-card">
        Capy Swing
        <small>Swing the vines. 5 levels.</small>
      </button>
<button type="button" id="play-waddle" class="game-card">
        Ice Waddle
        <small>Eat the fish. Dodge the seals. 5 mazes.</small>
      </button>
      <button type="button" id="play-spot" class="game-card">
        Silk Spot
        <small>Find the changes. All pictures, or the hard five.</small>
      </button>
      <button type="button" id="play-burst" class="game-card">
        Berry Burst
        <small>Swap and match three. 15 gardens.</small>
      </button>
      <button type="button" id="play-hunt" class="game-card">
        Word Hunt
        <small>Find the hidden words. A new hunt each game.</small>
      </button>
      <button type="button" id="play-skate" class="game-card">
        Ollie Cat
        <small>Touch to skate, flip, and grind. 15 parks.</small>
      </button>
      <button type="button" id="open-settings" class="game-card">
        Level settings
        <small>Change the timer, stones, holds, cars, and swings for each level.</small>
      </button>
    </section>
    <section id="crab" hidden>
      <header>
        <p class="emery">Emery is awesome</p>
        <h1>Hermit Crab Crossing</h1>
        <div class="head-actions">
          <button type="button" id="crab-settings">Settings</button>
          <button type="button" id="crab-games">Games</button>
        </div>
      </header>
      <div id="board">
        <div id="stage">
          <canvas id="game" width="480" height="720" aria-label="Hermit Crab Crossing. Emery is awesome."></canvas>
        </div>
        <div id="pad">
          <div class="dpad" role="group" aria-label="Hop">
            <button type="button" data-input="n">Up</button>
            <button type="button" data-input="w">Left</button>
            <button type="button" data-input="e">Right</button>
            <button type="button" data-input="s">Down</button>
          </div>
          <div class="actions">
            <button type="button" data-input="tuck">Tuck</button>
            <button type="button" data-input="pause">Pause</button>
          </div>
          <button type="button" data-input="confirm" id="continue">Play</button>
        </div>
      </div>
    </section>
    <section id="race" hidden>
      <header class="slim-head">
        <button type="button" id="race-games">Games</button>
        <p id="race-heading">Pick a racer</p>
      </header>
      <div id="race-board">
        <div id="race-stage">
          <div id="race-frame">
            <canvas id="race-world" width="480" height="720" aria-hidden="true"></canvas>
            <canvas id="race-canvas" width="480" height="720" aria-label="Woodland Grand Prix"></canvas>
          </div>
        </div>
        <div id="race-picker"></div>
        <div id="race-pad" hidden>
          <button type="button" id="race-next">Next level</button>
        </div>
      </div>
    </section>
    <section id="fish" hidden>
      <header class="slim-head">
        <button type="button" id="fish-games">Games</button>
        <p id="fish-heading">Pond Fishing</p>
      </header>
      <div id="fish-board">
        <div id="fish-stage">
          <canvas id="fish-canvas" width="480" height="720" aria-label="Pond Fishing"></canvas>
        </div>
        <div id="fish-pad">
          <button type="button" id="fish-next" hidden>Next level</button>
        </div>
      </div>
    </section>
    <section id="axo" hidden>
      <header class="slim-head">
        <button type="button" id="axo-games">Games</button>
        <p id="axo-heading">Axolotl Patrol</p>
      </header>
      <div id="axo-board">
        <div id="axo-stage">
          <canvas id="axo-canvas" width="480" height="720" aria-label="Axolotl Patrol"></canvas>
        </div>
        <div id="axo-pad">
          <button type="button" id="axo-next" hidden>Next level</button>
        </div>
      </div>
    </section>
    <section id="rascal" hidden>
      <header class="slim-head">
        <button type="button" id="rascal-games">Games</button>
        <p id="rascal-heading">Web Rascal</p>
      </header>
      <div id="rascal-board">
        <div id="rascal-stage">
          <canvas id="rascal-canvas" width="480" height="720" aria-label="Web Rascal"></canvas>
        </div>
        <div id="rascal-pad">
          <button type="button" id="rascal-next" hidden>Next level</button>
        </div>
      </div>
    </section>
    <section id="capy" hidden>
      <header class="slim-head">
        <button type="button" id="capy-games">Games</button>
        <p id="capy-heading">Capy Swing</p>
      </header>
      <div id="capy-board">
        <div id="capy-stage">
          <canvas id="capy-canvas" width="480" height="720" aria-label="Capy Swing"></canvas>
        </div>
        <div id="capy-pad">
          <button type="button" id="capy-next" hidden>Next level</button>
        </div>
      </div>
    </section>
<section id="waddle" hidden>
      <header class="slim-head">
        <button type="button" id="waddle-games">Games</button>
        <p id="waddle-heading">Ice Waddle</p>
      </header>
      <div id="waddle-board">
        <div id="waddle-stage">
          <canvas id="waddle-canvas" width="480" height="720" aria-label="Ice Waddle"></canvas>
        </div>
        <div id="waddle-pad">
          <button type="button" id="waddle-next" hidden>Next level</button>
        </div>
      </div>
    </section>
    <section id="spot" hidden>
      <header class="slim-head">
        <button type="button" id="spot-games">Games</button>
        <p id="spot-heading">Silk Spot</p>
      </header>
      <div id="spot-board">
        <div id="spot-stage">
          <canvas id="spot-canvas" width="480" height="720" aria-label="Silk Spot"></canvas>
        </div>
        <div id="spot-pad">
          <button type="button" id="spot-all">All pictures<small>25 pictures</small></button>
          <button type="button" id="spot-hard">Hard five<small>8 changes each</small></button>
          <button type="button" id="spot-next" hidden>Next picture</button>
        </div>
      </div>
    </section>
    <section id="burst" hidden>
      <header class="slim-head">
        <button type="button" id="burst-games">Games</button>
        <p id="burst-heading">Berry Burst</p>
      </header>
      <div id="burst-board">
        <div id="burst-stage">
          <canvas id="burst-canvas" width="480" height="720" aria-label="Berry Burst"></canvas>
        </div>
        <div id="burst-pad">
          <button type="button" id="burst-next" hidden>Next garden</button>
        </div>
      </div>
    </section>
    <section id="hunt" hidden>
      <header class="slim-head">
        <button type="button" id="hunt-games">Games</button>
        <p id="hunt-heading">Word Hunt</p>
      </header>
      <div id="hunt-board">
        <div id="hunt-stage">
          <canvas id="hunt-canvas" width="480" height="720" aria-label="Word Hunt"></canvas>
        </div>
        <div id="hunt-pad">
          <button type="button" id="hunt-next" hidden>Next puzzle</button>
        </div>
      </div>
    </section>
    <section id="skate" hidden>
      <header class="slim-head">
        <button type="button" id="skate-games">Games</button>
        <p id="skate-heading">Ollie Cat</p>
      </header>
      <div id="skate-board">
        <div id="skate-stage">
          <div id="skate-frame">
            <canvas id="skate-world" width="480" height="720" aria-hidden="true"></canvas>
            <canvas id="skate-canvas" width="480" height="720" aria-label="Ollie Cat"></canvas>
          </div>
        </div>
        <div id="skate-pad">
          <button type="button" id="skate-next" hidden>Next level</button>
        </div>
      </div>
    </section>
    <section id="settings" hidden>
      <header>
        <p class="emery">Emery is awesome</p>
        <h1>Level settings</h1>
        <div class="head-actions">
          <button type="button" id="settings-play">Play</button>
          <button type="button" id="settings-games">Games</button>
        </div>
      </header>
      <div id="tune-tabs" class="level-tabs" role="tablist" aria-label="Levels"></div>
      <div id="tune-form"></div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
